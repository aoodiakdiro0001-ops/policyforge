function toast(m){let d=document.getElementById('toast');d.textContent=m;d.style.display='block';clearTimeout(d._h);d._h=setTimeout(()=>d.style.display='none',2200);}
function copyTxt(x){try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(x);}catch(e){}toast(t('copied'));}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function sGet(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}}
function sSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function parseHdr(text){const h={};String(text||'').split('\n').forEach(l=>{const i=l.indexOf(':');if(i>0){const k=l.slice(0,i).trim().toLowerCase(),v=l.slice(i+1).trim();if(k&&v)h[k]=h[k]?h[k]+'; '+v:v;}});return h;}
function parseCSP(v){
const out={};String(v||'').split(';').forEach(p=>{p=p.trim();if(!p)return;const i=p.search(/\s/);if(i<0)out[p.toLowerCase()]=[];else out[p.slice(0,i).toLowerCase()]=p.slice(i+1).trim().split(/\s+/);});
return out;
}
function auditCSP(h){
const csp=parseCSP(h['content-security-policy']||'');
const out=[];let s=100;
const put=(dir,st,w,vals,fix)=>{out.push({dir,st,w,vals:vals||[],fix});if(st!=='p')s-=w;};
const has=d=>!!csp[d];
const chk=(d,w,need,allowData)=>{const v=csp[d]||null;if(!v)return put(d,'f',w,[],need);
const bad=v.filter(x=>/^(unsafe-inline|unsafe-eval|\*)/i.test(x)&&!(/nonce-|sha256-|sha384-|sha512-/i.test(x)));
const wild=v.filter(x=>/^[*.]/.test(x)||x==='*');
const data=!allowData&&v.some(x=>/^(data|blob):/i.test(x));
const http=v.some(x=>/^http:/i.test(x));
if(bad.length||wild.length||data||http)return put(d,'w',w,v,need+' (remove: '+bad.concat(wild).concat(data?['data:/blob:']:[]).concat(http?['http:']:[]).join(', ')+')');
return put(d,'p',0,v,'');};
chk('default-src',15,"default-src 'self'");
chk('script-src',20,"script-src 'self' (+nonces)");
chk('object-src',10,"object-src 'none'");
chk('base-uri',8,"base-uri 'self'");
chk('frame-ancestors',10,"frame-ancestors 'none' (or 'self')");
chk('form-action',7,"form-action 'self'");
chk('style-src',8,"style-src 'self' (+hashes for inline)");
chk('img-src',6,"img-src 'self' data: (only if needed)",true);
chk('connect-src',8,"connect-src 'self' (+API hosts)");
chk('font-src',4,"font-src 'self' (+font CDNs)",true);
chk('media-src',2,"media-src 'self'",true);
chk('worker-src',2,"worker-src 'self'");
s=Math.max(0,s);
const grade=s>=90?'A+':s>=80?'A':s>=70?'B':s>=60?'C':s>=45?'D':'F';
return {dirs:out,score:s,grade,raw:!!(h['content-security-policy'])};
}
function renderAudit(r,url){
const gc=r.grade[0]==='A'?'gA':r.grade==='B'?'gB':r.grade==='C'?'gC':'gF';
let h=`<div class="grade"><div class="badge ${gc}">${r.grade}</div><div><b>${r.score}/100</b><br><small style="color:var(--mut)">${esc(url||'')}</small></div></div>`;
if(!r.raw)h+=`<div class="note">CSP: ${t('dMissing')}</div>`;
h+=r.dirs.map(c=>{const cls=c.st==='p'?'p':c.st==='w'?'w':'f';
return `<div class="check"><div class="hd"><span class="dot ${cls}"></span>${esc(c.dir)} — ${c.st==='p'?t('dOk'):c.st==='w'?'⚠':'✕'} (−${c.w})</div><small class="mono">${esc(c.vals.join(' ')).slice(0,220)}</small>${c.fix?`<code>${t('fixL')}: ${esc(c.fix)}</code>`:''}</div>`;}).join('');
document.getElementById('auditRes').innerHTML=h;
return r;
}
function norm(u){u=String(u||'').trim();if(u&&!/^[a-z][a-z0-9+.-]*:\/\//i.test(u))u='https://'+u;try{const x=new URL(u);if(x.protocol!=='http:'&&x.protocol!=='https:')return '';return x.href;}catch(e){return '';}}
async function autoAudit(){
const u=norm(document.getElementById('urlIn').value);
if(!u){toast(t('needUrl'));return;}
document.getElementById('auditRes').innerHTML='<p class="sub">'+t('fetching')+'</p>';
try{
const r=await fetch('https://api.allorigins.win/raw?url='+encodeURIComponent(u));
if(!r.ok)throw 0;const h={};r.headers.forEach((v,k)=>{h[k.toLowerCase()]=v;});
renderAudit(auditCSP(h),u+' (proxy)');
}catch(e){document.getElementById('auditRes').innerHTML='<div class="note">'+t('fetchFail')+'</div>';}
}
function manualAudit(){renderAudit(auditCSP(parseHdr(document.getElementById('hdrIn').value)),'manual');}
function auditCors(){
const txt=document.getElementById('corsIn').value;
if(!txt.trim()){toast(t('needCfg'));return;}
const out=[];let s=100;
const put=(n,st,w,d,f)=>{out.push({n,st,w,d,f});if(st!=='p')s-=w;};
const L=txt.toLowerCase();
const star=/access-control-allow-origin\s*:\s*\*|origin\s*:\s*['"]?\*/.test(L);
const cred=/allow-credentials\s*:\s*true|credentials\s*:\s*true/.test(L);
const nullO=/allow-origin\s*:\s*null|origin\s*:\s*['"]?null/.test(L);
const vary=!/(^|[\s;])vary\s*:/.test(L)&&/allow-origin/.test(L);
const meth=(txt.match(/allow-methods\s*:\s*([^\n;]+)/i)||[])[1]||'';
const overMeth=/delete|put|patch/i.test(meth)&&/\*/.test(meth);
const maxAge=(txt.match(/max-age\s*=\s*(\d+)/i)||[])[1];
put('ACAO=*',star?'f':'p',25,star?'*':'ok',star?"Never use '*' with credentials; echo explicit origins":'');
put('ACAC=true',cred?(star?'f':'w'): 'p',star&&cred?25:8,cred?'true':'—',cred?'If needed with *, switch to explicit origin + Vary: Origin':'');
put('null origin',nullO?'f':'p',15,nullO?'null':'ok',nullO?'Remove null — sandboxed iframes can read responses':'');
put('Vary: Origin',vary?'w':'p',8,vary?'missing':'ok',vary?'Add Vary: Origin when reflecting origins':'');
put('Methods',overMeth?'w':'p',8,meth||'—',overMeth?'Narrow to needed methods':'');
put('Preflight cache',maxAge&&+maxAge>86400?'w':'p',4,maxAge||'—',maxAge&&+maxAge>86400?'Lower to ≤86400':'');
put('Credentials scope',cred&&!/same|strict/i.test(txt)?'w':'p',5,cred?'on':'off',cred?'Scope cookies to exact paths/domains':'');
s=Math.max(0,s);
const grade=s>=90?'A+':s>=80?'A':s>=70?'B':s>=60?'C':s>=45?'D':'F';
const gc=grade[0]==='A'?'gA':grade==='B'?'gB':grade==='C'?'gC':'gF';
document.getElementById('corsRes').innerHTML=`<div class="grade"><div class="badge ${gc}">${grade}</div><div><b>${s}/100</b></div></div>`+out.map(c=>{const cls=c.st==='p'?'p':c.st==='w'?'w':'f';
return `<div class="check"><div class="hd"><span class="dot ${cls}"></span>${esc(c.n)} (−${c.w})</div><small class="mono">${esc(c.d).slice(0,160)}</small>${c.f?`<code>${t('fixL')}: ${esc(c.f)}</code>`:''}</div>`;}).join('');
}
function genPolicy(){
const ty=document.getElementById('gType').value;
const frames=document.getElementById('gFrames').checked,ana=document.getElementById('gAnalytics').checked;
const fonts=document.getElementById('gFonts').checked,rep=document.getElementById('gReport').checked;
const extra=document.getElementById('gExtra').value.trim().split(/\s+/).filter(Boolean);
const ex=extra.length?' '+extra.join(' '):'';
let csp='';
if(ty==='static')csp=`default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:${fonts?' font-src \'self\' https://fonts.gstatic.com;':';'} object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';${rep?" report-uri /csp-report;":''}`;
else if(ty==='app')csp=`default-src 'self'; script-src 'self'${ana?' https://www.googletagmanager.com https://www.google-analytics.com':''}${ex}; style-src 'self' 'unsafe-inline'${fonts?' https://fonts.googleapis.com':''}; img-src 'self' data: https:${fonts?' https://fonts.gstatic.com':''}; connect-src 'self'${ana?' https://www.google-analytics.com':''}${ex}; font-src 'self'${fonts?' https://fonts.gstatic.com':''}; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors ${frames?"'self'":"'none'"};${rep?' report-uri /csp-report;':''}`;
else csp=`default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none';${rep?' report-uri /csp-report;':''}`;
const nx=`add_header Content-Security-Policy "${csp}" always;`;
const ap=`Header always set Content-Security-Policy "${csp}"`;
const ex2=`app.use(helmet({contentSecurityPolicy:{directives:{defaultSrc:["'self'"],scriptSrc:["'self'"]}}})) // + reportOnly first!`;
document.getElementById('genOut').textContent=`# Content-Security-Policy\n${csp}\n\n# nginx\n${nx}\n\n# Apache\n${ap}\n\n# Express (helmet) — test with reportOnly first!\n${ex2}`;
}
function dlGen(){const c=document.getElementById('genOut').textContent;if(!c.trim())return;const b=new Blob([c],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='csp-policy.txt';a.click();toast(t('dlDone'));}
async function scanLeaks(){
const u=norm(document.getElementById('leakUrl').value);
if(!u){toast(t('needUrl'));return;}
const box=document.getElementById('leakRes');box.innerHTML='<p class="sub">'+t('fetching')+'</p>';
try{
const r=await fetch('https://api.allorigins.win/raw?url='+encodeURIComponent(u));
if(!r.ok)throw 0;const html=await r.text();
const doms={};
const rx=[/src\s*=\s*["']([^"'#]+)["']/gi,/(?:href\s*=\s*["']([^"'#]+)["'])/gi,/url\(\s*["']?([^"'\)]+)["']?\s*\)/gi,/fetch\s*\(\s*["']([^"']+)["']/g,/axios\.[a-z]+\s*\(\s*["']([^"']+)["']/g];
rx.forEach(re=>{let m;while((m=re.exec(html))!==null){try{const abs=new URL(m[1],u);if(abs.host!==new URL(u).host)doms[abs.host]=(doms[abs.host]||0)+1;}catch(e){}}});
const list=Object.keys(doms).sort((a,b)=>doms[b]-doms[a]);
const cspRaw=(document.getElementById('hdrIn').value.match(/content-security-policy\s*:\s*([^\n]+)/i)||[])[1]||'';
box.innerHTML=list.length?`<table class="pt">${list.slice(0,40).map(d=>{const blocked=cspRaw&&!/^\s*$/.test(cspRaw)&&d&&cspRaw.indexOf(d)<0&&cspRaw.indexOf('*')<0;return `<tr><td class="mono">${d}</td><td>×${doms[d]}</td><td>${blocked?'🚫 blocked by CSP':'✅ allowed/needed in CSP'}</td></tr>`;}).join('')}</table>`:'<p style="color:var(--mut)">—</p>';
}catch(e){box.innerHTML='<div class="note">'+t('fetchFail')+'</div>';}
}
function watches(){return sGet('pf_watch',[]);} function setWatches(w){sSet('pf_watch',w);}
function hashStr(s){let h=0;for(let i=0;i<s.length;i++)h=((h<<5)-h+s.charCodeAt(i))|0;return String(h);}
async function watchSite(){
const u=norm(document.getElementById('urlIn').value);
if(!u){toast(t('needUrl'));return;}
let base='';
try{const r=await fetch('https://api.allorigins.win/raw?url='+encodeURIComponent(u));if(r.ok){const h={};r.headers.forEach((v,k)=>{h[k.toLowerCase()]=v;});base=hashStr(JSON.stringify(h));}}catch(e){}
const w=watches();if(w.some(x=>x.u===u)){toast(t('dup'));return;}
w.push({u,base});setWatches(w);renderWatch();toast(t('added')+' · '+t('baseL'));
}
function renderWatch(){const w=watches();
document.getElementById('watchDiv').innerHTML=w.length?`<b>${t('wListT')}</b>`+w.map((x,i)=>`<div style="margin:6px 0"><span class="mono">${esc(x.u)}</span> <button onclick="unwatch(${i})" style="background:none;border:none;cursor:pointer">❌</button></div>`).join(''):'';
}
function unwatch(i){const w=watches();w.splice(i,1);setWatches(w);renderWatch();}
async function pollWatch(){
const w=watches();if(!w.length)return;
for(const x of w){
try{const r=await fetch('https://api.allorigins.win/raw?url='+encodeURIComponent(x.u));if(!r.ok)continue;
const h={};r.headers.forEach((v,k)=>{h[k.toLowerCase()]=v;});
const hh=hashStr(JSON.stringify(h));
if(x.base&&hh!==x.base){x.base=hh;notify(t('chgT'),x.u+' — '+t('chgB'));}
else if(!x.base)x.base=hh;}catch(e){}}
setWatches(w);
}
function notify(ti,bo){try{if('Notification' in window&&Notification.permission==='granted')new Notification(ti,{body:String(bo).slice(0,140)});}catch(e){}}
function enableNotif(){try{if(!('Notification' in window)){toast(t('permOff'));return;}Notification.requestPermission().then(p=>toast(p==='granted'?t('permOn'):t('permOff')));}catch(e){toast(t('permOff'));}}
function testNotif(){notify(t('testT'),t('testB'));}
function proJoin(){try{const L=sGet('pf_pro',[]);L.unshift({time:new Date().toLocaleString()});sSet('pf_pro',L);}catch(e){}toast(t('joined'));}
function copyTxt(x){try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(x);}catch(e){}toast(t('copied'));}
function renderPay(){const el=document.getElementById('payBox');if(!el)return;const P=CONFIG.pay;
const row=(l,v)=>`<div style="margin:6px 0"><b>${l}:</b> <code style="direction:ltr">${v}</code> <button class="alt" style="padding:4px 12px;font-size:12px" onclick="copyTxt('${v.replace(/ /g,'')}')">${t('btnCopy')}</button></div>`;
el.innerHTML=`<b>${t('payT2')}</b>`+row('₿ BTC',P.btc)+row('₮ USDT-TRC20',P.usdt)+row('🏦 '+P.name+' TRY',P.try)+row('🏦 '+P.name+' USD',P.usd);}
function loadAds(){const A=CONFIG.ads,el=document.getElementById('adFoot');if(!el)return;
if(A.client){el.innerHTML='<ins class="adsbygoogle" style="display:block" data-ad-client="'+A.client+'" data-ad-slot="'+(A.slot||'')+'" data-ad-format="auto"></ins>';
if(!document.querySelector('script[src*="adsbygoogle"]')){const s=document.createElement('script');s.async=true;s.src='https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client='+A.client;s.crossOrigin='anonymous';document.head.appendChild(s);}try{(window.adsbygoogle=window.adsbygoogle||[]).push({});}catch(e){}}
else if(A.carbonServe){el.innerHTML='';const s=document.createElement('script');s.async=true;s.id='_carbonads_js';s.src='//cdn.carbonads.com/carbon.js?serve='+A.carbonServe+'&placement='+A.carbonPlacement;el.appendChild(s);}}
setInterval(()=>pollWatch(),300000);
setLang('en');loadAds();renderPay();renderWatch();
</script>
